name: Auto Update EPG

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python epg.py
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto Update EPG"
